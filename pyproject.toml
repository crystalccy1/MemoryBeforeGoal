[project]
name = "wholebodymem"
version = "0.1.0"
description = "Inference code for WholeBodyMem: adaptive SAM3 keyframe and object memory for humanoid loco-manipulation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = "==3.10.*"
# Exact versions of the paper evaluation: requirements/policy.txt and requirements/tracker.txt.
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.57.0",
    "diffusers==0.37.0",
    "accelerate==1.7.0",
    "peft==0.17.1",
    "safetensors==0.6.2",
    "qwen-vl-utils==0.0.14",
    "lerobot==0.3.3",
    "pydantic==2.10.6",
    "tyro==0.9.32",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "opencv-python==4.11.0.86",
    "omegaconf==2.3.0",
    "huggingface-hub==0.35.3",
    "fastapi==0.119.1",
    "uvicorn==0.38.0",
    "requests",
]

[project.optional-dependencies]
tracker = ["pycocotools==2.0.11", "scikit-image==0.25.2", "timm==1.0.17", "ftfy==6.1.1", "iopath==0.1.10"]
examples = ["av==16.0.1", "pyarrow==21.0.0"]

[project.scripts]
wholebodymem-serve = "wholebodymem.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
